# @mennara/auth CI. No secrets are used; every job runs with a read-only token and no persisted credentials.
# Node 22.22.3 (exact, as in the lib-http canonical build): jsdom 30 requires ^22.22.2, so 22.12.x crashes the tests.
# @mennara/http comes only from the hash-pinned tarball in vendor/ (see vendor/README.md); verify:deps enforces that.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1" # weekly, Monday 05:17 UTC: picks up new advisories
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"

jobs:
  verify:
    name: Dependencies, lint, types, tests, build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No version input: pnpm/action-setup uses "packageManager" from package.json (pnpm 10.29.2).
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.3
          cache: pnpm
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Verify vendored dependencies
        run: pnpm verify:deps
      - name: Verify installed dependencies
        run: node scripts/verify-vendored-dependencies.mjs --installed
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Verify distribution
        run: pnpm verify:dist

  audit-prod:
    name: Audit production dependencies (high/critical)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.3
      - name: pnpm audit --prod
        run: pnpm audit --prod --audit-level=high

  audit-all:
    name: Audit all dependencies (high/critical)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.3
      # Blocking at high/critical. One moderate finding (minimatch via eslint, dev only) is known and below this level.
      - name: pnpm audit (all)
        run: pnpm audit --audit-level=high
